<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Resume ATS Checker & Interview Helper</title>
<style>
:root { color-scheme: light; font-family: system-ui, sans-serif; } body { max-width: 1000px; margin: 40px auto; padding: 0 16px; color: #222; } textarea, input { width: 100%; box-sizing: border-box; font-family: monospace; } textarea { min-height: 180px; margin-bottom: 8px; } button { padding: 8px 16px; cursor: pointer; margin: 4px 4px 4px 0; } .tabs button.active { background: #333; color: #fff; } .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } .score { font-size: 42px; font-weight: bold; } .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin: 12px 0; } .chip { display: inline-block; padding: 2px 8px; border-radius: 12px; margin: 2px; font-size: 13px; } .missing { background: #ffe0e0; } .matched { background: #e0ffe0; } .hidden { display: none; } pre { white-space: pre-wrap; font-family: inherit; } @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } body { margin-top: 20px; } }
</style></head>
<body>
<h1>Resume ATS Checker & Interview Helper</h1>
<div class="tabs"><button class="active" onclick="showTab('analyze', this)">Analyze</button><button onclick="showTab('interview', this)">Interview</button></div>
<div id="analyze"><div class="grid"><div><label><b>Paste your resume</b></label><textarea id="resume" placeholder="Paste resume text here..."></textarea></div><div><label><b>Paste the job description</b></label><textarea id="jd" placeholder="Paste job description here..."></textarea></div></div><button onclick="analyze()">Analyze Match</button><span id="status"></span><div id="results" class="hidden"><div class="card"><div class="score" id="score"></div><div id="reasoning"></div></div><div class="card"><b>Missing keywords</b><br><div id="missing"></div><b>Matched keywords</b><br><div id="matched"></div></div><div class="card"><b>Suggestions</b><pre id="suggestions"></pre></div><button onclick="showTab('interview', document.querySelectorAll('.tabs button')[1])">Practice interview for this role →</button></div></div>
<div id="interview" class="hidden"><div id="chat" class="card" style="min-height:200px;"></div><input id="answer" placeholder="Type your answer and press Enter..." onkeydown="if(event.key==='Enter')sendAnswer()"><button onclick="startInterview()">Start / Restart Interview</button><button onclick="sendAnswer()">Send</button></div>
<script>
let interviewSystem = ''; let history = []; const jdValue = () => document.getElementById('jd').value;
function showTab(id, btn) { document.querySelectorAll('#analyze, #interview').forEach(d => d.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active')); if (btn) btn.classList.add('active'); }
async function analyze() { const resume=document.getElementById('resume').value, jd=jdValue(), status=document.getElementById('status'); status.textContent='Analyzing... (3 LLM steps)'; try { const res=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resume:resume,job_description:jd})}); const data=await res.json(); if(!res.ok) throw new Error(data.error||'Analysis failed'); status.textContent=''; document.getElementById('results').classList.remove('hidden'); document.getElementById('score').textContent=data.score.match_score+' / 100'; document.getElementById('reasoning').textContent=data.score.reasoning||''; document.getElementById('missing').innerHTML=(data.score.missing||[]).map(k=>'<span class="chip missing">'+k+'</span>').join(' ')||'—'; document.getElementById('matched').innerHTML=(data.score.matched||[]).map(k=>'<span class="chip matched">'+k+'</span>').join(' ')||'—'; document.getElementById('suggestions').textContent=data.suggestions; } catch(e) { status.textContent=e.message; } }
async function startInterview() { document.getElementById('chat').innerHTML=''; history=[]; const res=await fetch('/api/interview/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_description:jdValue()})}); const data=await res.json(); if(!res.ok) return addBubble('Error',data.error||'Unable to start interview'); interviewSystem=data.system; addBubble('Interviewer',data.question); history.push({role:'assistant',content:data.question}); }
function addBubble(who,text) { const div=document.createElement('div'), label=document.createElement('b'), pre=document.createElement('pre'); label.textContent=who+': '; pre.textContent=text; div.append(label,pre); document.getElementById('chat').appendChild(div); }
async function sendAnswer() { const input=document.getElementById('answer'), ans=input.value.trim(); if(!ans||!interviewSystem)return; input.value=''; addBubble('You',ans); history.push({role:'user',content:ans}); const res=await fetch('/api/interview/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:interviewSystem,history:history})}); const data=await res.json(); addBubble('Interviewer',data.reply||data.error); history.push({role:'assistant',content:data.reply||data.error}); }
</script></body></html>
